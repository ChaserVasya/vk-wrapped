  pull_down_button: ^0.10.1
  intl: ^0.20.2
  clock: ^1.1.1
  bloc_event_transformers: ^2.0.0
  slivers: ^0.0.1+2
  convert: ^3.1.1
  bubble: ^1.2.1
  table_sticky_headers: ^2.0.5
  dio_smart_retry: ^7.0.1
  dio_cache_interceptor: ^3.5.0

  permission_handler: ^12.0.0+1
  shimmer: ^3.0.0
  drift: ^2.27.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.20
  path: ^1.9.1
  pretty_dio_logger: ^1.4.0
  flutter_native_splash: ^2.4.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  melos: ^6.1.0
  mockito: ^5.4.6
  http_mock_adapter: ^0.6.1
  flutter_gen_runner: ^5.3.2
  freezed: ^3.0.6
  json_serializable: ^6.9.5
  injectable_generator:
    git:
      url: https://github.com/ChaserVasya/injectable
      ref: synced-with-retrofit-1
      path: injectable_generator
  retrofit_generator:
    git:
      url: https://github.com/ChaserVasya/retrofit.dart
      ref: synced-with-injectable-1.2
      path: generator
  build_runner: ^2.4.15
  auto_route_generator: ^10.1.0
  test: ^1.25.15
  yaml: ^3.1.3
  drift_dev: ^2.26.0
flutter_gen:
  output: lib/ui/resources/gen/
  line_length: 80
  integrations:
    flutter_svg: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_icon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/app_icon.jpg"
  remove_alpha_ios: true
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/memes/
