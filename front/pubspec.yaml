name: front
description: VK Wrapped - статистика прослушивания музыки
publish_to: 'none'
version: 1.10.1+110
environment:
  sdk: ^3.8.1
  flutter: ^3.32.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  bloc: ^9.0.0
  flutter_bloc: ^9.1.1
  bloc_presentation: ^1.1.1
  cupertino_icons: ^1.0.2
  sprintf: ^7.0.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  bloc_concurrency: ^0.3.0
  flutter_slidable: ^4.0.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.0.2
  share_plus: ^11.0.0
  rxdart: ^0.28.0
  path_provider: ^2.1.1
  meta: ^1.16.0
  logger: ^2.6.0
  collection: ^1.17.0
  dotted_line: ^3.2.2
  theme_tailor_annotation: ^3.0.1
  freezed_annotation: ^3.0.0
  dartx: ^1.2.0
  fast_immutable_collections: ^11.0.4
  injectable:
    git:
      url: https://github.com/ChaserVasya/injectable
      ref: synced-with-retrofit-1
      path: injectable
  retrofit:
    git:
      url: https://github.com/ChaserVasya/retrofit.dart
      ref: synced-with-injectable-1.2
      path: retrofit
  get_it: ^8.0.3
  auto_route: ^10.1.0+1
